[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["backend/notebooks", "backend/data", "results"]

[tool.ruff.lint]
select = ["F"]
ignore = ["E501"]
per-file-ignores = {"backend/run.py" = ["F401"]}

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
explicit_package_bases = true
no_implicit_optional = false
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
# Legacy data-processing scripts are not importable packages and are checked by
# the AST quality gate instead; application services remain type-checked here.
exclude = "backend/(notebooks|data|models|tests|scripts|extractors|utils)/|backend/(services/analysis_visualizer.py|services/similar_sample_finder.py|sandbox_runner.py)"

[tool.pytest.ini_options]
# TensorFlow 2.20 on Python 3.13 emits this upstream NumPy bridge warning.
filterwarnings = [
    "ignore:__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning:keras.*",
]
